name: Build APK
     on: [push, workflow_dispatch]
       push: null
       workflow_dispatch: null
     jobs:
       build:
         runs-on: ubuntu-latest
         steps:
           - uses: actions/checkout@v4
           - uses: actions/setup-java@v4
             with:
               distribution: temurin
               java-version: 17
           - uses: android-actions/setup-
     android@v3
           - run: yes | sdkmanager --licenses;
     sdkmanager "platforms;android-34" "build-
     tools;34.0.0"
           - run: curl -sL https://services.
     gradle.org/distributions/gradle-8.7-bin.
     zip -o /tmp/gradle.zip && unzip -q /tmp/
     gradle.zip -d /tmp && /tmp/gradle-8.7/bin/
     gradle :app:assembleDebug --stacktrace
           - uses: actions/upload-artifact@v4
             with:
               name: lab-assistant-apk-v2-
     downloads
               path: app/build/outputs/apk/
     debug/*.apk
